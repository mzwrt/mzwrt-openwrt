name: Clean Up All Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 需要 jq；ubuntu-latest 通常自带，缺失则安装
          command -v jq >/dev/null || sudo apt-get install -yqq jq
          runs="$(gh api --paginate "repos/${{ github.repository }}/actions/runs" \
            --jq '.workflow_runs[].id')"
          for run_id in $runs; do
            echo "Deleting workflow run ID: $run_id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/${run_id}" || true
          done
